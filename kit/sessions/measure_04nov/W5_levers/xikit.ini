[xikit]
; the game as it is: nothing swapped (docs/KIT.md); what this phase measures follows
swap=0
count_calls=0
hotkey=0
report_every=600
spike_ms=50
log_folder=1
; W5 levers: your best speedfix settings (speedfix.ini here; no uncap/frame_step, so Frame_Render is the game's and its
; calls can be timed), measured as W2
mods=speedfix.dll
frames=1
sysstats=1
env=1
sample=3
sample_ms=1
sample_other_ms=5
imports=1
callsites=2
