[d3d8on11]
; the executor on its own thread (the mode of the 26 Oct plaza run, T3); the executor filter and batches on (their
; defaults); the presentation interval the game asks for (no present_interval line: d3d8on11 honours the game's)
mode=thread
exec_filter=1
exec_batch=1
; the executor's draw time by the game's call site, every 600 frames (a measurement: the same in every A and B segment)
draw_sites=1
