; d3d8on11: where its Direct3D 11 work runs (kit/d3d8on11/README.md)
;   direct: on the game's thread
;   thread: on a thread of its own
;   remote: in d8x_arm64.exe (ARM64 Windows) or d8x.exe, a process of its own
[d3d8on11]
mode=thread
; each Present waits for the next vertical blank (kit/d3d8on11/README.md, "Present interval")
present_interval=1
