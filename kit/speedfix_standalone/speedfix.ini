; speedfix.ini for the standalone speedfix (kit/speedfix_standalone/README.md). Every key of kit/speedfix/README.md
; works here; a key left out takes speedfix's default. Re-read within 60 frames of being saved.
[speedfix]
; the game's time step answered in whole 1/60 s ticks with the fraction carried: walking, the camera and animations
; follow real time at any frame rate (docs/RENDERER.md 3a, 3b). With Windower's frame divisor 0 this is what keeps the
; game's speed steady when the frame rate is above or below 60.
frame_step=1
; the defaults, written out: skip Direct3D state the device already holds; each actor's occlusion re-tested every 8
; frames instead of 4; the DXT threshold for textures loaded from now on
state_cache=1
vertex_shader_cache=1
occlusion_stagger=8
texture_compression=1
; a summary line every 60 s in speedfix_standalone.log
stats_every=60
