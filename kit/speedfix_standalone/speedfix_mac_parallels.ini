; speedfix.ini for the M5 MacBook Pro in Parallels (Windows 11 on ARM; the game x86-emulated; dgVoodoo D3D11 output).
; Rename to speedfix.ini. What each lever is for, and where it was measured: kit/speedfix/README.md, "The levers".
[speedfix]
; below 60 fps the game's own step is what normal play looks like; frame_step only matters above 60 (RENDERER 3a)
frame_step=0
; fewer draws: the measured gain on this machine (docs/D3D11.md: the same triangles in 33 draws cost 28 to 64 times less)
skin_merge=1
batch_up_draws=1
merge_scenes=1
; state the device does not need: Cell_DrawQuadBlended's per-quad blend toggles (3.6 ms a frame measured), state blocks
lazy_state=1
block_cache=1
extended_state_cache=1
; stutter: about 1,450 vertex shaders made while playing; one made per declaration
vs_dedupe=1
; this CPU reports "Virtual CPU": the game's x87 skinning loop took 13.3% of the render thread here; its SSE loop instead
sse_skinning=1
; the occlusion readback (19.5% of the render thread in run 6156): each probe answered with the object's previous one
occlusion_late=1
occlusion_stagger=8
state_cache=1
vertex_shader_cache=1
texture_compression=1
motion_stats=1
stats_every=60
; the in-session A/B of the levers that switch live: off (A) against on (B), 30 s phases, 4 rounds, after 60 s
ab_levers=occlusion_late,merge_scenes,lazy_state
ab_after=60
