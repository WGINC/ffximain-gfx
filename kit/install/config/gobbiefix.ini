; gobbiefix.ini -- Longthinx gobbiefix. These is YOUR knobs. Gobbie read them each time game start.
; Change, save, start game. README.md say what each one do, long version.
; The other .ini files (d3d8on11, speedfix, xikit) is gobbie's own pot. No poke unless gobbie say.
[gobbiefix]
; 0 = no cap, game run fast as it can. 10-1000 = hold game to that many frames a second.
; With a cap, smooth_pacing take a nap (only one of them work at a time).
frame_cap=0
; 1 = gobbie space frames even, at a speed that follow the scene. 0 = frames go when ready.
smooth_pacing=1
; 2 = what gobbie measure best (fewer frames thrown away, less judder). 3 = more frames made, more thrown away.
; 4 = allowed, never measured. Only for renderer=d3d12.
swap_buffers=2
; 1 = far-away textures get smaller copies: less shimmer and sparkle. 0 = game's textures as they is.
mipmaps=1
; 0-16 = how sharp textures stay when seen at a slant (needs mipmaps=1). 16 = sharpest.
anisotropy=16
; 1 = names shrink smooth with distance. 0 = game's own 80 little size steps (they pulse).
smooth_names=1
; 1 = round shadows sized to each body. 0 = game's own shadow size.
fitted_shadows=1
; d3d12 = gobbie's fast renderer (falls back to d3d11 by itself if d3d12 no start). d3d11 = the older way.
renderer=d3d12
; 1 = when game get updated and gobbie no know the new build, a window tell you. 0 = no window.
update_notice=1
; 0 = short logs. 1 = gobbie scribble stats in logs (for helping fix things). Or: gobbiefix_debug.bat on / off.
debug=0
