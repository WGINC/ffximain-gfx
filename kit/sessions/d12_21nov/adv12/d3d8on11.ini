[d3d8on11]
; the 21 Nov session, start adv12: advanced shadows, Direct3D 12; otherwise the 20 Nov settings
; exec_batch are Direct3D 11 levers: the Direct3D 12 executor does without them (its log says so). draw_delta and
; gpu_skin are the D3D8 side's and apply to both.
backend=d3d12
mode=thread
exec_filter=1
exec_batch=1
swap_flip=0
draw_sites=0
buffer_arena=1
draw_merge=1
draw_delta=1
gpu_skin=1
mipmaps=1
anisotropy=16
