[xikit]
; the game as it is: nothing swapped (docs/KIT.md); what this phase measures follows
swap=0
count_calls=0
hotkey=0
report_every=600
spike_ms=50
log_folder=1
; W3 deep: the calls three levels below the main loop timed (callsites=4: Frame_Render's callees and what they call),
; and the hot Windows calls too (imports=2: heap, critical sections, strings). No sampling
frames=1
sysstats=1
env=0
sample=0
imports=2
callsites=4
callsite_max=500
