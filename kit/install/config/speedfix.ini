[speedfix]
; gobbie's own pot (Longthinx gobbiefix): the knobs for players is in gobbiefix.ini, which write over the keys it
; names here at each start. The rest: what gobbie measured best; no poke unless gobbie say.
state_cache=1
vertex_shader_cache=1
extended_state_cache=1
state_cache_reset_each_scene=1
batch_up_draws=1
batch_up_max_prims=0
batch_up_max_bytes=0
occlusion_stagger=8
skip_actor_occlusion=0
skip_all_occlusion_readbacks=0
occlusion_hold=1
occlusion_late=1
occlusion_nowait=1
occlusion_first=2
texture_compression=1
texture_compression_value=15
cpu_tier=1
lazy_state=1
block_cache=1
vs_dedupe=1
sse_skinning=1
merge_scenes=0
skin_merge=0
gpu_skin=1
task_draws=0
; simple shadows sized by each character's model (sf_game.cpp: shadow_fit); 46 = half-width 0.46 of the footprint's diagonal
shadow_fit=1
shadow_fit_scale=46
; names shrink with distance continuously (sf_game.cpp: name_smooth); 0 = the game's 80 size steps
name_smooth=1
; a looping sound refused a voice kept and asked again (sf_game.cpp: sound_retry); 0 = the game deletes it
sound_retry=1
; sphere-mapped metal at the PS2's mapping and strength (SkinAndDrawV2's fork: sphere_shine); 0 = the game's
sphere_shine=1
; lamp glows drawn in front of their lamp (sf_device.cpp: flare_fix, from dagnyfix); 0 = the game's
flare_fix=1
; the aura's capture texture size, 256 the game's (fork/Post_CreateScreenEffectTargets.fork.cpp: aura_size, from SpectralFix via dagnyfix)
aura_size=256
; the game's frame time from the precise counter (28 Nov: under uncap too; the character's walking speed frame to
; frame 15.2% -> 11.1% and 18.9% -> 10.2% varied, the game's time whole ms in 1% of frames instead of 100%)
precise_pacing=1
null_draws=0
; seconds between the statistics lines in xikit.log, 0 none (gobbiefix.ini debug=1: 60)
stats_every=0
frame_cap_fps=0
uncap=1
frame_step=3
; even frame spacing (27 Nov: frames over twice their neighbours' time 67 -> 19 and 77 -> 22 a minute): each frame
; held to the 90th percentile of the last 120 frames' time; no fixed rate
pace_adaptive=1
pace_pct=90
ab_levers=
