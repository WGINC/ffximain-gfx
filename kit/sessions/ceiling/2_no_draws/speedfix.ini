; speedfix.ini -- the speedfix mod of the in-game kit (kit/speedfix/README.md). Re-read when it changes;
; what changed is written to xikit.log. Delete this file to get the defaults back.
[speedfix]
; skip SetRenderState / SetTextureStageState / SetTexture / SetVertexShader that repeat the current value
state_cache=1
vertex_shader_cache=1
; also SetTransform / SetViewport / SetLight / LightEnable / SetStreamSource / SetIndices
extended_state_cache=1
; forget the cache at each BeginScene / EndScene (guards against overlays that call the device below the kit)
state_cache_reset_each_scene=1
; merge back-to-back DrawPrimitiveUP calls into one; caps (0 = none) on one merged draw. With this and
;   extended_state_cache off at the start, speedfix hooks only the cached setters (less overhead on every other
;   call); turning either on then takes effect at the next start
batch_up_draws=1
batch_up_max_prims=0
batch_up_max_bytes=0
; even frame pacing (0 = off); 60, 30, 20 or 15 keep the game's time exact; more than 60 is not allowed
frame_cap_fps=0
; each actor's visibility re-tested every 4 (the game's), 8 or 16 frames
occlusion_stagger=8
; A/B switches: every actor visible without its query; every occlusion query visible without its readback
skip_actor_occlusion=0
skip_all_occlusion_readbacks=1
; fewer textures CPU-encoded at load (1-15; textures loaded afterwards)
texture_compression=1
texture_compression_value=15
; the SSE math tier on any CPU with SSE (only before the game has chosen its tier)
cpu_tier=1
; levers to measure (each off by default; README.md):
; hold render-state / texture-stage-state / texture changes until a draw reads them: a change undone before the
;   draw never reaches the device (the game's UI quads turn alpha blending off and on again for each quad). Hooks
;   every method that reads that state, so it takes effect at the next start when it was off at this one
lazy_state=1
; applying a state block the game recorded (BeginStateBlock..EndStateBlock) updates the state cache with what the
;   block sets, instead of forgetting the whole cache (the effects apply 2-3 blocks each; docs/HISTORY.md 11 Oct);
;   live both ways
block_cache=1
; a vertex shader with the same declaration (and no shader code) is made once and its handle given out again
;   (loading: some 1,450 creations a session, 3 distinct shaders); the same at the next start or live
vs_dedupe=1
; the game's SSE skinning loops (0x1002F1D0, 0x100311A0) on any CPU that reports SSE: the game's CPU detection
;   (0x1000D400) sets its SSE flag only for an Intel or Transmeta vendor string, so other CPUs, and the x86
;   emulation of Windows on ARM if it reports another vendor, skin with x87; live both ways
sse_skinning=1
; one BeginScene/EndScene pair a frame: an EndScene is held, and dropped with the BeginScene after it, until Present,
;   Reset, CopyRects, UpdateTexture or GetFrontBuffer (the game ends and begins scenes several times a frame)
merge_scenes=0
; a model's runs of triangle-list records (contiguous indices, no state call between them, no envmap, projected-
;   texture or offscreen pass) drawn as one DrawIndexedPrimitive (docs/SKINMERGE.md). Forks SkinAndDrawV2 at the
;   start when on there; then live both ways
skin_merge=1
; at the start: each minute, frame time and draws, readbacks, new textures and creations per frame, split by
;   whether the camera moved (the view transform changed); hooks the draws, SetTransform and the Create methods
motion_stats=0
; the game's frame limiter timed with the performance counter instead of whole milliseconds, and its wait made
;   precise (a high-resolution timer, then a spin to the moment): 60.0 frames a second instead of 58.8. Live both
;   ways; use it without frame_cap_fps
precise_pacing=1
; a test, not a speedup: the draw calls return without drawing (nothing is drawn); the game's own work and every
;   other device call stay. Live both ways; use it with skip_all_occlusion_readbacks=1 (what the game reads back
;   from an undrawn frame is wrong)
null_draws=1
; seconds between speedfix's statistics lines in xikit.log
stats_every=60
; A/B of levers with no keys: ab_levers takes the NAMES of settings above, e.g.
;     ab_levers=merge_scenes; skip_all_occlusion_readbacks; sse_skinning
;   (comma: measured together; semicolon: one after another). ab_after seconds after it is saved, speedfix
;   switches by itself between A = those settings off (occlusion_stagger 4, the game's) and B = as set above,
;   ab_phase seconds each, in the order A,B,B,A, ab_rounds times; nothing to type for A or B. The first
;   ab_settle frames of a phase are left out. Results in xikit.log (lines 'speedfix: ab'). Stand still while it
;   runs; keep xikit.ini's ab=0. Empty it and set it again for another run
ab_levers=null_draws
ab_after=60
ab_phase=30
ab_rounds=4
ab_settle=60
