; speedfix.ini for the 6 Nov session: the levers measured to help, above 60 with the game's time following real time
; (uncap=1), frame_step=3 (the tick loops given the fraction: no frames where the camera and characters stop) and
; occlusion_late=1 (each occlusion readback read at the object's next probe, from d3d8on11's snapshot)
[speedfix]
state_cache=1
vertex_shader_cache=1
extended_state_cache=1
state_cache_reset_each_scene=1
batch_up_draws=1
batch_up_max_prims=0
batch_up_max_bytes=0
occlusion_stagger=8
skip_actor_occlusion=0
skip_all_occlusion_readbacks=0
occlusion_late=1
texture_compression=1
texture_compression_value=15
cpu_tier=1
lazy_state=1
block_cache=1
vs_dedupe=1
sse_skinning=1
merge_scenes=0
skin_merge=0
precise_pacing=0
null_draws=0
stats_every=60
ab_levers=
frame_cap_fps=0
uncap=1
frame_step=1
