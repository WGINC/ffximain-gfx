[d3d8on11]
; installed defaults (kit/install): Direct3D 12, the settings of the 21 Nov session, mip levels on
; exec_batch are Direct3D 11 levers: the Direct3D 12 executor does without them (its log says so). draw_delta and
; gpu_skin are the D3D8 side's and apply to both.
backend=d3d12
mode=thread
exec_filter=1
exec_batch=1
swap_flip=0
draw_sites=0
buffer_arena=1
draw_merge=1
draw_delta=1
gpu_skin=1
mipmaps=1
anisotropy=16
; d3d8.dll loads xikit.dll (and so speedfix) itself when it knows the game's build; 0: not
load_kit=1
; shown in the notice when the game is a build the kit does not know
update_url=https://github.com/WGINC/ffximain-gfx
update_notice=1
