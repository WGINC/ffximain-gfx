; xikit.ini -- re-read every 60 frames when it changes (docs/KIT.md)
[xikit]
; 1: run the reconstructed functions instead of the originals (all verified ones, minus the lists below)
swap=0
; only these (comma-separated RVAs like 0x6C530 / addresses like 0x1006C530 / names); empty = all
only=
; never these (same forms). Gfx_DestroyD3DHolder faults when swapped, cause not found (docs/GAPS.md)
exclude=Gfx_DestroyD3DHolder
; 1: also swap functions flagged SEH or speedfix-site (see the manifest)
include_flagged=0
; 1: also swap functions whose gate runs did not reach all of the original's code (flag 4 in the manifest).
;    Their PASS says nothing about the code no compared trial reached; only= / exclude= still apply
include_untested=0
; 1: leave out the functions speedfix_hook patches inside, when speedfix_hook.dll is loaded
respect_speedfix=1
; 1: count the calls of every swapped function (xikit_calls_<pid>.csv)
count_calls=1
; frames between call-count reports
report_every=600
; 1: Ctrl+Alt+F9 switches every swap off / back on, at the next frame
hotkey=1
; 1: log every function patched and restored (otherwise only totals)
log_each=0
; 1: bisect mode: with the screen broken press Ctrl+Alt+F10 or create xikit_bisect_bad.txt; the kit then swaps a part of
;    the functions that have run, and you answer F10 / xikit_bisect_bad.txt if the screen is still broken or F11 /
;    xikit_bisect_good.txt if it looks right. It narrows to the smallest set that breaks the screen (one function, or
;    several that only break it together) and logs it (xikit.log, xikit_bisect.txt). F12 / xikit_bisect_stop.txt ends it
;    and swaps everything again (culprits found included)
bisect=0
; 1: Ctrl+Alt+F8 records the game's Direct3D calls for 17 frames with the swaps flipped at every frame (off, on, off,
;    ... off) and writes xikit_trace_<pid>_<n>.txt (kit/d3dprof/trace_diff.py compares each swapped frame with the
;    unswapped frames either side of it: which replaced function makes the game draw differently). Stand still in a
;    scene first; takes effect at the next start
trace=0
; 0: the older trace instead, 4 frames with every swap off, then 4 with the swaps on
trace_alternate=1
; the keys do not reach every game window: with trace=1, trace_after=SECONDS runs the trace by itself that many seconds after
;    the start (then every trace_every seconds, trace_count times in all; each writes xikit_trace_<pid>_<n>.txt). Creating
;    the file xikit_trace_now.txt next to xikit.dll starts one too, and with bisect=1 xikit_bisect_bad.txt / _good.txt /
;    _stop.txt answer like F10 / F11 / F12
trace_after=0
trace_every=120
trace_count=3
; K > 0: an alternating trace also saves the picture of frames 8-2K .. 8+2K (K swapped frames each with both
;    neighbours; about 8 MB a frame at 1920x1080); kit/d3dprof/pictures.py compares them
trace_pictures=0
; 1: the trace also hashes what the game writes into vertex and index buffers (their Lock/Unlock are wrapped)
trace_buffers=1
; 1: d3dprof in the same process (d3dprof_<pid>.csv); takes effect at the next start
profile=0
; 1: frame capture (docs/KIT.md): from the start, copies of what the game writes into its default-pool vertex and
;    index buffers are kept (the game cannot read those back), and a capture writes one whole frame, every call with its
;    data and every resource it uses, to xikit_fcap_<pid>_<n>.fcap (tens of MB) for kit/fcap/replay.c. A capture is
;    taken fcap_after seconds after the start (then every fcap_every seconds, fcap_count in all), or when the file
;    xikit_fcap_now.txt is created next to xikit.dll. Takes effect at the next start
fcap=1
fcap_after=240
fcap_every=30
fcap_count=3
; 1 (with profile=1): also the time inside each Direct3D call, per call site, on the render thread (us_per_call in
;    d3dprof_<pid>.csv); takes effect at the next start
call_time=0
; mod DLLs next to xikit.dll, comma-separated (sdk/, docs/SDK.md); loaded at the start; their hooks stay on with
;    swap=0 and go off with the swaps for F9 and a trace's unswapped frames
mods=
; 1: load each mod from a copy and load it again when its file changes (a rebuilt mod, while the game runs; also
;    on creating xikit_reload_now.txt); takes effect at the next start
mod_reload=0
; record real calls for the gate (docs/KIT.md): manifest names, comma-separated; each writes an .xcap
; capture_follow: for the call's own pointers (registers, the first 8 arguments), also the pages after each, up
;    to this many (an object or list longer than a page)
capture=
capture_count=1
capture_after=0
capture_pages=20000
capture_follow=16
; 1: sample the render thread every sample_ms (xikit_samples_<pid>.csv; kit/d3dprof/samples.py reads it); frame timing
;    (xikit_timing_<pid>.csv) is always written, every report_every frames; takes effect at the next start
sample=0
sample_ms=1
; 1: measure the call sites listed in xikit_facts.txt (pipeline/fact_sites.py): what each callee pops, where it
;    goes; xikit_facts_<pid>.csv every report_every frames; takes effect at the next start
facts=0
; 1: everything the kit writes (this log, profiles, traces, timing, samples, captures, A/B results) goes into a new
;    folder per start, xikit_logs\<date>_<time>_<pid>; 0: next to xikit.dll as before. Read at the start
log_folder=1
; 1: an A/B test with no keys: ab_after seconds from now (or from the start), the kit switches everything it adds
;    off (A: no swaps, no mod hooks, as F9) and on (B) in phases of ab_phase seconds, A B B A for each of ab_rounds
;    rounds (ABBA cancels a steady drift in the scene). The first ab_settle frames of each phase are left out. Each
;    phase's frame times and a summary go to xikit_ab_<pid>.csv and xikit.log. Stand still while it runs. Setting
;    ab=0 stops it; set it to 0 and back to 1 to run another. Not affected: what a mod did once at its start
;    (speedfix's cpu_tier, texture_compression)
ab=0
ab_after=60
ab_phase=30
ab_rounds=4
ab_settle=60
; every frame slower than this many ms (Present to Present) goes to xikit_spikes_<pid>.csv with its frame number (the
;    resource log's frame numbers match, with profile=1: what was created in a stutter); 0 = off
spike_ms=50
