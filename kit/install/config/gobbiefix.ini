; gobbiefix.ini -- Longthinx gobbiefix. Pshhh... these is YOURknobs. Gobbie sniff them every gamestart.
; Change, save, start game. README.md say what each one do, longlong version. Shkohhh...
; The other .ini files (d3d8on11, speedfix, xikit) is gobbiepot. No pokepoke unless gobbie say.
[gobbiefix]
; 0 = no cap, game go fastfast as it can. 10-1000 = hold game to that many frames a second.
; With a cap, smooth_pacing take a nap (only one of them work at a time).
frame_cap=0
; 1 = gobbie space frames eveneven, at a speed that follow the scene. 0 = frames go whenready.
smooth_pacing=1
; 2 = what gobbie measure best (fewer frames throwaway, less judder). 3 = more frames made, more throwaway.
; 4 = allowed, never measured. Only for renderer=d3d12.
swap_buffers=2
; 1 = faraway textures get smaller copies: less shimmer and sparkle. 0 = game's textures as they is.
mipmaps=1
; 0-16 = how sharp textures stay when seen slantways (needs mipmaps=1). 16 = sharpest.
anisotropy=16
; 1 = names shrink smoothsmooth with distance. 0 = game's own 80 little sizesteps (they pulse).
smooth_names=1
; 1 = round shadows sized to each body. 0 = game's own shadowsize.
fitted_shadows=1
; 1 = rain and wind sounds that find every voice busy wait their turn and come back. 0 = game's way: they go away for good.
sound_retry=1
; 1 = shiny metal (gold armour and such) shine like on the PS2. 0 = game's dull way.
sphere_shine=1
; d3d12 = gobbie's fastfast renderer (fall back to d3d11 by itself if d3d12 no start). d3d11 = the olderway.
renderer=d3d12
; 1 = when game get patched and gobbie no know the new build, a window tell youuu. 0 = no window.
update_notice=1
; 0 = shortshort logs. 1 = gobbie scribble stats in logs (for helpfixing). Or: gobbiefix_debug.bat on / off.
debug=0
