[d3d8on11]
; the executor on its own thread (the mode of the 26 Oct plaza run, T3); the executor filter and batches on (their
; defaults); the presentation interval the game asks for (no present_interval line: d3d8on11 honours the game's)
mode=thread
exec_filter=1
exec_batch=1
; the executor's draw time by the game's call site, every 600 frames (a measurement: the same in every A and B segment)
draw_sites=1
; the GPU's time for each frame's work, logged every 600 frames (timestamp queries; read back without waiting)
gpu_time=1
; the swap chain: the blt model (as before) unless the A/B has it on. The A/B (abtest flip): the flip-model swap chain
; off, on, on, off, 30 s each, started by abtest.bat (the file d3d8on11_ab_go.txt), the first 60 frames of each left out
swap_flip=0
exec_ab=1
exec_ab_lever=flip
exec_ab_go=1
exec_ab_phase=30
exec_ab_rounds=1
exec_ab_settle=60
