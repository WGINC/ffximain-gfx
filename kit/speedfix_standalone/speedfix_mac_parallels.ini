; speedfix.ini for the M5 MacBook Pro in Parallels (Windows 11 on ARM; the game x86-emulated; dgVoodoo D3D11 output).
; Rename to speedfix.ini. What each lever is for, and where it was measured: kit/speedfix/README.md, "The levers".
[speedfix]
; below 60 fps the game's own step is what normal play looks like; frame_step only matters above 60 (RENDERER 3a)
frame_step=0
; fewer draws: the measured gain on this machine (docs/D3D11.md: the same triangles in 33 draws cost 28 to 64 times less)
; skin_merge=2: on top of 1, a character's opaque draws under the same state (only the vertex buffer or a light
; between them, HISTORY 6 Oct) go out as one draw of a joined index list; blended parts keep their order
skin_merge=2
batch_up_draws=1
merge_scenes=1
; state the device does not need: Cell_DrawQuadBlended's per-quad blend toggles (3.6 ms a frame measured), state blocks
lazy_state=1
block_cache=1
extended_state_cache=1
; stutter: about 1,450 vertex shaders made while playing; one made per declaration
vs_dedupe=1
; this CPU reports "Virtual CPU": the game's x87 skinning loop took 13.3% of the render thread here; its SSE loop instead
sse_skinning=1
; the occlusion readbacks. On dgVoodoo each read of the 16x16 target waits 3 to 5 ms, late or not (28 Oct run:
; occlusion_late's late read 3.2 to 4.1 ms each, 15.6 to 21.5 ms a frame in a crowd), so occlusion_late is off and the
; actors' queries are skipped instead: every actor counts as visible (more characters drawn behind walls, no wait)
occlusion_late=0
skip_actor_occlusion=1
occlusion_stagger=16
state_cache=1
vertex_shader_cache=1
texture_compression=1
motion_stats=1
stats_every=60
; the in-session A/B: skin_merge off (A) against 2 (B), 30 s phases, after 60 s. Stand still in a crowd (where
; the character draws are) for the whole 5 minutes, or the phases measure different scenes
ab_levers=skin_merge
ab_after=60
