[d3d8on11]
; the 17 Nov session: Direct3D 12, with sampler tables in heaps of their own where the driver needs it (d8_exec12.h); the same settings. buffer_arena, draw_merge, exec_filter and
; exec_batch are Direct3D 11 levers: the Direct3D 12 executor does without them (its log says so). draw_delta and
; gpu_skin are the D3D8 side's and apply to both.
backend=d3d12
mode=thread
exec_filter=1
exec_batch=1
swap_flip=0
draw_sites=0
buffer_arena=1
draw_merge=1
draw_delta=1
gpu_skin=1
