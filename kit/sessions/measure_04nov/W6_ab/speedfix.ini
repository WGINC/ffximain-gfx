; speedfix.ini for W6: everything speedfix does is off (the game as it is) except the two tests the A/B switches:
; group 1 null_draws (the draw calls do not reach the device: nothing is drawn while B runs), group 2
; skip_all_occlusion_readbacks (every occlusion query counts as visible, no readback). Each: A B B A, twice, 20 s a
; phase, the first 60 frames of each left out; it starts 60 s after the game reads this file. Stand still.
[speedfix]
state_cache=0
vertex_shader_cache=0
extended_state_cache=0
batch_up_draws=0
frame_cap_fps=0
occlusion_stagger=4
texture_compression=0
cpu_tier=0
lazy_state=0
block_cache=0
vs_dedupe=0
sse_skinning=0
merge_scenes=0
skin_merge=0
precise_pacing=0
uncap=0
frame_step=0
occlusion_late=0
skip_actor_occlusion=0
null_draws=1
skip_all_occlusion_readbacks=1
stats_every=60
ab_after=60
ab_phase=20
ab_rounds=2
ab_settle=60
ab_levers=null_draws; skip_all_occlusion_readbacks
