[xikit]
; the game as it is: nothing swapped (docs/KIT.md); what this phase measures follows
swap=0
count_calls=0
hotkey=0
report_every=600
spike_ms=50
log_folder=1
; W2 where: W1, and every thread sampled raw (sample=3), the game's Windows calls timed (imports=1), the main loop's and
; Frame_Render's calls timed (callsites=2)
frames=1
sysstats=1
env=1
sample=3
sample_ms=1
sample_other_ms=5
imports=1
callsites=2
